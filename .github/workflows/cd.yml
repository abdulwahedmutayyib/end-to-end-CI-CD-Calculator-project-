name: Python CD Pipeline

on:
  workflow_run:
    workflows: ["Python CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    name: Build and Deploy to Kubernetes

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker version

      - name: Verify kubectl
        run: kubectl version --client

      - name: Verify Minikube
        run: minikube status

      - name: Verify Kubernetes Cluster
        run: kubectl get nodes

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER }}

      - name: Build Docker Image
        run: docker build -t wahed1321/calculator-app:latest .

      - name: Push Docker Image
        run: docker push wahed1321/calculator-app:latest

      - name: Deploy Kubernetes Manifests
        run: kubectl apply -f k8s/

      - name: Restart Deployment
        run: kubectl rollout restart deployment/devops-app

      - name: Wait for Rollout
        run: kubectl rollout status deployment/devops-app --timeout=180s

      - name: Verify Pods
        run: kubectl get pods -o wide

      - name: Verify Services
        run: kubectl get svc

      - name: Verify Deployment
        run: kubectl get deployment
